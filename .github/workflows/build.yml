name: build

on:
  push:
    branches: [main]
    paths-ignore:
      - amis.json
      - fleet.json
      - README.md
      - LICENSE
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build
  cancel-in-progress: false

env:
  FLEET_IMAGES_BUCKETS: '{"us-west-2": "tesser-fleet-images-prod-131798513069-us-west-2", "us-east-1": "tesser-fleet-images-prod-131798513069-us-east-1"}'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - run: for f in setup.sh smoke.sh cleanup.sh boot/tesser-boot shim/bun hibernate/tesser-hibernate boot/initrd/init boot/09_tesser kernel/build.sh fleet/*.sh fleet/host/setup.sh fleet/host/smoke.sh fleet/host/tesser-host-boot fleet/guest/tesser-resumed fleet/guest/tesser-hostkeys fleet/guest/tesser-ip; do bash -n "$f"; done

      - run: node --test test/*.test.mjs

      - name: Canary, verify the live boxd with this repo's verifier
        run: |
          set -euo pipefail
          dir=$(mktemp -d)
          for f in bundle statement statement.sig; do
            curl -fsSL "https://api.tesser.sh/v1/boxd/$f" -o "$dir/$f"
          done
          install -m 755 verify/verify.mjs "$dir/tesser-verify-boxd"
          "$dir/tesser-verify-boxd" "$dir/bundle" "$dir/statement" "$dir/statement.sig"

  # The box image (on the kernel images.yml built) and the fleet host image,
  # each an AMI built by packer.
  ami:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        image: [box, host]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::131798513069:role/tesser-ami-publish
          role-duration-seconds: 7200
          aws-region: us-west-2

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: kernel
          path: kernel-out

      - uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        with:
          version: 1.16.1

      - run: packer init ${{ matrix.image }}.pkr.hcl

      - run: packer build -color=false -var "source_sha=${GITHUB_SHA}" ${{ matrix.image }}.pkr.hcl

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.image }}-manifest
          path: manifest.json
          if-no-files-found: error

  # The tesser kernel and the root disk every fleet microVM boots.
  images:
    needs: check
    uses: ./.github/workflows/images.yml

  # The guest image, published under images/build-<run id>/ to the images
  # bucket in each region, which hosts read with credentials the cell gives
  # them. Nothing reads it until tesser pins this release.
  guest:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE_ID: build-${{ github.run_id }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: guest-image

      - run: |
          set -euo pipefail
          jq -n --arg id "$IMAGE_ID" --arg root "$(sha256sum root.ext4.zst | cut -d' ' -f1)" --arg kernel "$(sha256sum vmlinux.zst | cut -d' ' -f1)" \
            '{id: $id, root: $root, kernel: $kernel}' > guest.json
          cat guest.json

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::131798513069:role/tesser-fleet-image-publish
          aws-region: us-west-2

      - name: Publish
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key) \(.value)"' <<< "$FLEET_IMAGES_BUCKETS" | while read -r region bucket; do
            for f in root.ext4.zst vmlinux.zst; do
              aws s3 cp --only-show-errors --region "$region" "$f" "s3://$bucket/images/$IMAGE_ID/$f"
            done
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: guest
          path: guest.json
          if-no-files-found: error

  publish:
    needs: [ami, guest]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: built

      - name: amis.json and fleet.json
        run: |
          set -euo pipefail
          amis() { jq -r '.builds[-1].artifact_id | split(",") | map(split(":") | {(.[0]): .[1]}) | add' "$1"; }
          amis built/box-manifest/manifest.json > amis.json
          jq -n --argjson hostAmis "$(amis built/host-manifest/manifest.json)" --slurpfile image built/guest/guest.json \
            --argjson imagesBuckets "$FLEET_IMAGES_BUCKETS" \
            '{hostAmis: $hostAmis, image: $image[0], imagesBuckets: $imagesBuckets}' > fleet.json
          cat amis.json fleet.json

      - name: Commit amis.json and fleet.json
        id: commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch -q --deepen=50 origin main
          last=$(git log -1 --format=%s origin/main -- amis.json | sed -n 's/^amis: built from \([0-9a-f]*\).*/\1/p')
          if [ -n "$last" ] && git cat-file -e "$last^{commit}" 2>/dev/null && ! git merge-base --is-ancestor "$last" "$GITHUB_SHA"; then
            echo "main already publishes images built from $last, newer than $GITHUB_SHA; dispatch a fresh build instead" >&2
            exit 1
          fi
          git add amis.json fleet.json
          git commit -m "amis: built from ${GITHUB_SHA} (run ${GITHUB_RUN_ID})"
          git pull --rebase -X theirs origin main
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "Built from ${GITHUB_SHA} by ${RUN_URL}"
            echo
            jq -r '.builds[-1].custom_data | "Base: `\(.base)` (\(.base_name))"' built/box-manifest/manifest.json
            echo
            echo '| image | region | ami |'
            echo '| --- | --- | --- |'
            jq -r 'to_entries[] | "| box | \(.key) | `\(.value)` |"' amis.json
            jq -r '.hostAmis | to_entries[] | "| fleet host | \(.key) | `\(.value)` |"' fleet.json
            echo
            jq -r '.image | "Fleet guest image `\(.id)`: root.ext4.zst sha256 `\(.root)`, vmlinux.zst sha256 `\(.kernel)`"' fleet.json
          } > notes.md
          gh release create "build-${GITHUB_RUN_ID}" --target "${{ steps.commit.outputs.sha }}" --title "build ${GITHUB_RUN_ID}" --notes-file notes.md amis.json fleet.json

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::131798513069:role/tesser-ami-publish
          aws-region: us-west-2

      # Guest images are never rotated: a sleeping box is a delta from the
      # image it was cut from, for as long as it sleeps.
      - name: Rotate, keep the newest 2 images of each kind per region and the last 3 releases'
        run: |
          set -euo pipefail
          # tesser runs an older release until ami-bump and a deploy move it, and
          # builds can publish minutes apart, so the last 3 releases' AMIs stay.
          pinned=$(git log -n 3 --format=%H HEAD -- amis.json)
          for c in $pinned; do git show "$c:amis.json"; done | jq -s 'map(to_entries) | add | group_by(.key) | map({key: .[0].key, value: map(.value)}) | from_entries' > prev-box.json
          for c in $pinned; do git show "$c:fleet.json" 2>/dev/null | jq '.hostAmis // {}' || echo '{}'; done | jq -s 'map(to_entries) | add // [] | group_by(.key) | map({key: .[0].key, value: map(.value)}) | from_entries' > prev-host.json
          rotate() {
            local region=$1 kind=$2
            aws ec2 describe-images --region "$region" --owners self \
              --filters "Name=name,Values=tesser-$kind-*" "Name=tag:tesser:ami,Values=$kind" > images.json
            keep=$(jq -c --argjson prev "$(jq -c --arg r "$region" '.[$r] // []' "prev-$kind.json")" \
              '.Images | sort_by(.CreationDate) | reverse | .[:2] | map(.ImageId) + $prev' images.json)
            jq -c --argjson keep "$keep" '.Images[] | select(.ImageId as $id | $keep | index($id) | not)
              | {id: .ImageId, snapshots: [.BlockDeviceMappings[].Ebs.SnapshotId // empty]}' images.json |
            while read -r image; do
              id=$(jq -r .id <<< "$image")
              echo "deregistering $kind $region $id"
              aws ec2 deregister-image --region "$region" --image-id "$id"
              for snapshot in $(jq -r '.snapshots[]' <<< "$image"); do
                aws ec2 delete-snapshot --region "$region" --snapshot-id "$snapshot"
              done
            done
          }
          for region in $(jq -r 'keys[]' amis.json); do rotate "$region" box; done
          for region in $(jq -r '.hostAmis | keys[]' fleet.json); do rotate "$region" host; done

      # A public host AMI is launchable from any account. AWS caps public AMIs
      # per region; this shares a host only while that leaves two slots: one
      # for the next build's box AMI, which packer makes public as it builds,
      # and one for a box AMI a failed run left public before rotation.
      - name: Share host AMIs publicly while the quota has room
        run: |
          set -euo pipefail
          for region in $(jq -r '.hostAmis | keys[]' fleet.json); do
            id=$(jq -r --arg r "$region" '.hostAmis[$r]' fleet.json)
            quota=$(aws service-quotas get-service-quota --region "$region" --service-code ec2 --quota-code L-0E3CBAB9 --query 'Quota.Value' --output text)
            public=$(aws ec2 describe-images --region "$region" --owners self --filters Name=is-public,Values=true --query 'length(Images)' --output text)
            if [ "$((public + 3))" -le "${quota%.*}" ]; then
              aws ec2 modify-image-attribute --region "$region" --image-id "$id" --launch-permission 'Add=[{Group=all}]'
              echo "host $region $id is public ($((public + 1)) of ${quota%.*})"
            else
              echo "::warning::host $region $id stays private: $public of ${quota%.*} public AMIs leaves box AMIs fewer than two free"
            fi
          done
