name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - run: for f in setup.sh smoke.sh cleanup.sh boot/tesser-boot shim/bun hibernate/tesser-hibernate kernel/build.sh fleet/*.sh fleet/host/setup.sh fleet/host/smoke.sh fleet/host/tesser-host-boot fleet/guest/tesser-resumed fleet/guest/tesser-hostkeys; do bash -n "$f"; done

      - run: node --test test/*.test.mjs

      - uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        with:
          version: 1.16.1

      - run: mkdir -p kernel-out && for t in box host; do packer init "$t.pkr.hcl" && packer validate -var "source_sha=${GITHUB_SHA}" "$t.pkr.hcl"; done
